name: companyagentshq

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-companyagentshq}@db:5432/companyagentshq
    REDIS_URL: redis://redis:6379/0
    BUS_BACKEND: redis
    QUEUE_BACKEND: arq
    STORAGE_BACKEND: s3
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-companyagentshq}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-companyagentshq-dev}
    S3_BUCKET: companyagentshq
    OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-companyagentshq}
      POSTGRES_DB: companyagentshq
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-companyagentshq}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-companyagentshq-dev}
    volumes:
      - minio:/data
    healthcheck:
      test: mc ready local
      interval: 5s
      retries: 20

  migrate:
    <<: *backend
    command: alembic -c alembic.ini upgrade head
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: python -c "import urllib.request as u; u.urlopen('http://localhost:8000/health')"
      interval: 10s
      retries: 12

  worker:
    <<: *backend
    command: arq app.worker.WorkerSettings
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: wget -q -O /dev/null http://localhost/
      interval: 10s
      retries: 6

volumes:
  db:
  redis:
  minio:
