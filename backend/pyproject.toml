[project]
name = "companyagentshq"
version = "0.1.0"
description = "Empresa de agentes de IA gestionada desde una oficina isométrica"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "redis>=5.0",
  "arq>=0.26",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "anthropic>=1.0",
  "pypdf>=4.3",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "boto3>=1.34",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-redis",
  "boto3-stubs",
  "pgserver>=0.1.4",
  "moto[s3]>=5.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "S311", "B008", "S105", "S106", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S", "ASYNC"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
